# Rust workspace of the datafusion_executor extension.
# Built by ../Makefile; the C extension links the df_ffi static library.

[workspace]
resolver = "2"
members = ["df_core", "df_ffi"]
# vendored crates are path dependencies, not members (vendor/README.md)
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
datafusion = { version = "55.2", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
libc = "0.2"
serde_json = "1"
futures = "0.3"
df_core = { path = "df_core" }

# DataFusion 55.2.0 with apache/datafusion#24891 (vendor/README.md).
[patch.crates-io]
datafusion-physical-plan = { path = "vendor/datafusion-physical-plan" }

# panic must stay "unwind": every FFI entry point relies on catch_unwind to
# turn a panic into an ordinary PostgreSQL ERROR.  "abort" would take the
# whole backend down instead.
[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
debug = "line-tables-only"   # readable backtraces in gdb on release builds
