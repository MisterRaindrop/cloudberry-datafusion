# The DataFusion engine of the datafusion_executor extension.  Built by
# ../../Makefile: df_ffi becomes vec_engine_datafusion.so, which the
# extension opens at run time.

[workspace]
resolver = "2"
members = ["df_core", "df_ffi"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# DataFusion main with apache/datafusion#26264 (the final merge of a
# spilled sort leaving memory for others), from the branch of that pull
# request, until a release has it; then back to crates.io.  Main also has
# apache/datafusion#24891 (the spill pool deadlock), which 55.2.0 lacked.
datafusion = { git = "https://github.com/MisterRaindrop/datafusion", rev = "5c59c075f2b158f12be02d80380887855dba4653", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
libc = "0.2"
serde_json = "1"
futures = "0.3"
df_core = { path = "df_core" }
# the version DataFusion uses, for its C Data Interface (the engine ABI's
# batches, include/vec_engine.h)
arrow = { version = "60", default-features = false, features = ["ffi"] }

# panic must stay "unwind": every FFI entry point relies on catch_unwind to
# turn a panic into an ordinary PostgreSQL ERROR.  "abort" would take the
# whole backend down instead.
[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
debug = "line-tables-only"   # readable backtraces in gdb on release builds
