# cargo deny check (ci/lint.sh deps): known vulnerabilities and unmaintained
# crates (RustSec), licenses, and where crates come from.

[graph]
all-features = false

[advisories]
# every advisory fails the check, unmaintained crates included; an
# accepted one goes here with its reason
ignore = []

[licenses]
# what Apache-2.0 code may depend on
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "Unlicense",
]
confidence-threshold = 0.9

[licenses.private]
# this workspace's own crates are not published
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# DataFusion at the commit Cargo.toml names, until a release has it
allow-git = ["https://github.com/apache/datafusion"]
