#
# lint: license headers, the extension's scripts, cargo fmt, and cargo
# deny over the dependencies (ci/lint.sh), without Cloudberry.
#
# test: builds Apache Cloudberry (cached by commit), starts a demo cluster
# in Cloudberry's build container, builds the extension (C warnings fail
# it), the engines and the direct PAX reader, runs cargo clippy, the
# regression tests, the engine check and the Rust tests.  The steps are
# ci/ci.sh's.
#
# The weekly run, and a manual one with "full", add a second variant and a
# soak: "debug" builds Cloudberry with assertions (--enable-cassert) and
# runs the same tests on it, then the engine's unit tests under
# AddressSanitizer; "release" also loads TPC-H at scale factor 1 and runs
# tools/stress.py and tools/fuzz.py for a few minutes.
#
# The release variant packages what it built (ci/ci.sh package), kept as
# the run's artifact.  A tag v* runs the same and then publishes: a GitHub
# Release of the tag, its notes the tag's section of CHANGELOG.md, with the
# package attached.
#
# Pushes and pull requests build the Cloudberry commit CLOUDBERRY_PIN, which
# the expected outputs are for.  The weekly run takes Cloudberry's latest
# main instead, so that a change there the PAX patches, the hooks or the
# expected plans no longer fit shows; move the pin once it passes.

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      cloudberry_ref:
        description: 'apache/cloudberry branch, tag or commit (default: the pin)'
        default: ''
      full:
        description: 'also the debug variant and the soak, as the weekly run'
        type: boolean
        default: false

permissions:
  contents: read

env:
  CLOUDBERRY_PIN: 6b467e3250b6ffb3ccb4e61235635dbd6f875b0c

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0      # the tags, for ci/lint.sh ext
      - name: Install rustfmt
        run: |
          cd engines/datafusion
          rustup toolchain install --profile minimal --component rustfmt
      - name: Lint
        run: ci/lint.sh
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Dependencies' licenses and sources
        run: ci/lint.sh deps
      # A new advisory can come any day, whatever the change: it fails the
      # weekly run, and only shows on the others.
      - name: Dependencies' advisories
        continue-on-error: ${{ github.event_name != 'schedule' }}
        run: ci/lint.sh deps advisories

  plan:
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.p.outputs.variants }}
      full: ${{ steps.p.outputs.full }}
    steps:
      - id: p
        run: |
          if [ '${{ github.event_name }}' = schedule ] || [ '${{ github.event.inputs.full }}' = true ]; then
            echo 'variants=["release","debug"]' >> "$GITHUB_OUTPUT"
            echo 'full=true' >> "$GITHUB_OUTPUT"
          else
            echo 'variants=["release"]' >> "$GITHUB_OUTPUT"
            echo 'full=false' >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.plan.outputs.variants) }}
    env:
      ENABLE_DEBUG: ${{ matrix.variant == 'debug' }}
    container:
      image: apache/incubator-cloudberry:cbdb-build-rocky9-latest
      options: >-
        --user root
        -h cdw
        -v /usr/share:/host_usr_share
        -v /usr/local:/host_usr_local
        -v /opt:/host_opt

    steps:
      - name: Free disk space
        run: |
          rm -rf /host_opt/hostedtoolcache /host_usr_local/lib/android \
                 /host_usr_share/dotnet /host_opt/ghc /host_usr_local/.ghcup \
                 /host_usr_share/swift /host_usr_local/share/powershell \
                 /host_usr_local/share/chromium /host_usr_share/miniconda \
                 /host_opt/az /host_usr_share/sbt || true
          df -h /

      - name: Check out vec_executor
        uses: actions/checkout@v7
        with:
          path: vec_executor
          fetch-depth: 0      # the tags, which name the package

      - name: Find the Cloudberry commit
        id: cbdb
        run: |
          ref='${{ github.event.inputs.cloudberry_ref }}'
          if [ -z "$ref" ]; then
            if [ '${{ github.event_name }}' = schedule ]; then ref=main; else ref=$CLOUDBERRY_PIN; fi
          fi
          if [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            sha=$ref
          else
            sha=$(git ls-remote https://github.com/apache/cloudberry "$ref" | head -1 | cut -f1)
          fi
          test -n "$sha"
          echo "Cloudberry $ref: $sha" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Restored and saved explicitly, before the demo cluster puts its data
      # directories under gpAux/gpdemo.
      - name: Restore the Cloudberry build
        id: cbdb-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /usr/local/cloudberry-db
            cloudberry/gpAux/gpdemo
            cloudberry/contrib/pax_storage/src/cpp
          key: cloudberry-rocky9-${{ matrix.variant }}-${{ steps.cbdb.outputs.sha }}

      - name: Check out Cloudberry
        if: steps.cbdb-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: apache/cloudberry
          ref: ${{ steps.cbdb.outputs.sha }}
          path: cloudberry
          submodules: true

      - name: Prepare the container
        run: |
          su - gpadmin -c /tmp/init_system.sh
          chown -R gpadmin:gpadmin "$GITHUB_WORKSPACE"
          if [ -d /usr/local/cloudberry-db ]; then chown -R gpadmin:gpadmin /usr/local/cloudberry-db; fi

      - name: Build Cloudberry
        if: steps.cbdb-cache.outputs.cache-hit != 'true'
        run: su - gpadmin -c "cd '$GITHUB_WORKSPACE' && ENABLE_DEBUG=$ENABLE_DEBUG vec_executor/ci/ci.sh cloudberry cloudberry"

      - name: Save the Cloudberry build
        if: steps.cbdb-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            /usr/local/cloudberry-db
            cloudberry/gpAux/gpdemo
            cloudberry/contrib/pax_storage/src/cpp
          key: cloudberry-rocky9-${{ matrix.variant }}-${{ steps.cbdb.outputs.sha }}

      # Saved right after the build (below), not only when the job passes.
      - name: Restore the Rust build
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /home/gpadmin/.cargo/registry
            /home/gpadmin/.cargo/git
            vec_executor/engines/datafusion/target
          key: cargo-rocky9-${{ hashFiles('vec_executor/engines/datafusion/Cargo.lock', 'vec_executor/engines/datafusion/rust-toolchain.toml') }}-${{ hashFiles('vec_executor/engines/datafusion/**/*.rs') }}
          restore-keys: |
            cargo-rocky9-${{ hashFiles('vec_executor/engines/datafusion/Cargo.lock', 'vec_executor/engines/datafusion/rust-toolchain.toml') }}-
            cargo-rocky9-

      - name: Install Rust
        run: |
          chown -R gpadmin:gpadmin /home/gpadmin "$GITHUB_WORKSPACE"
          su - gpadmin -c "cd '$GITHUB_WORKSPACE' && vec_executor/ci/ci.sh rust"

      - name: Start a demo cluster
        run: su - gpadmin -c "cd '$GITHUB_WORKSPACE' && vec_executor/ci/ci.sh cluster cloudberry"

      - name: Build vec_executor
        run: su - gpadmin -c "cd '$GITHUB_WORKSPACE' && vec_executor/ci/ci.sh build cloudberry"

      - name: Save the Rust build
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            /home/gpadmin/.cargo/registry
            /home/gpadmin/.cargo/git
            vec_executor/engines/datafusion/target
          key: cargo-rocky9-${{ hashFiles('vec_executor/engines/datafusion/Cargo.lock', 'vec_executor/engines/datafusion/rust-toolchain.toml') }}-${{ hashFiles('vec_executor/engines/datafusion/**/*.rs') }}

      - name: Clippy
        if: matrix.variant == 'release'
        run: su - gpadmin -c "cd '$GITHUB_WORKSPACE' && vec_executor/ci/ci.sh clippy"

      - name: Test
        run: su - gpadmin -c "cd '$GITHUB_WORKSPACE' && vec_executor/ci/ci.sh test cloudberry"

      - name: AddressSanitizer
        if: matrix.variant == 'debug'
        run: su - gpadmin -c "cd '$GITHUB_WORKSPACE' && vec_executor/ci/ci.sh asan"

      - name: Soak
        if: matrix.variant == 'release' && needs.plan.outputs.full == 'true'
        run: su - gpadmin -c "cd '$GITHUB_WORKSPACE' && vec_executor/ci/ci.sh soak cloudberry"

      - name: Package
        if: matrix.variant == 'release'
        run: |
          su - gpadmin -c "cd '$GITHUB_WORKSPACE' && CLOUDBERRY_COMMIT=${{ steps.cbdb.outputs.sha }} vec_executor/ci/ci.sh package cloudberry package"

      - name: Keep the package
        if: matrix.variant == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: package
          path: package/

      - name: Keep the test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-output-${{ matrix.variant }}
          path: |
            vec_executor/fuzz-*.txt
            vec_executor/regression.diffs
            vec_executor/regression.out
            vec_executor/results
            vec_executor/results-engine
            cloudberry/gpAux/gpdemo/datadirs/qddir/demoDataDir-1/log
          if-no-files-found: ignore

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: package
          path: package
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${GITHUB_REF#refs/tags/}
          ci/release-notes.sh "${tag#v}" > notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" package/* --clobber
          else
            gh release create "$tag" --verify-tag --title "vec_executor ${tag#v}" \
              --notes-file notes.md package/*
          fi
