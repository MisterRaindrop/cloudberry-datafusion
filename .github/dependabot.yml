# Weekly pull requests for newer versions of the GitHub Actions the
# workflows use.  The Rust dependencies are updated by hand (DataFusion is
# pinned to a commit, and the rest follow it); cargo deny checks their
# advisories in CI.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
